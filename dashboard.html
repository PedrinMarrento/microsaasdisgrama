<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — PropostaFlow</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="app-page">
  <aside class="sidebar">
    <a class="logo" href="dashboard.html">Proposta<span>Flow</span></a>
    <nav>
      <a class="active" href="dashboard.html">▦ Dashboard</a>
      <a href="clientes.html">👥 Clientes</a>
      <a href="propostas.html">📝 Propostas</a>
      <a href="nova-proposta.html">＋ Nova proposta</a>
    </nav>
    <button id="logoutBtn" class="sidebar-logout">Sair</button>
  </aside>

  <main class="app-main">
    <div class="app-header">
      <div>
        <p class="eyebrow">VISÃO GERAL</p>
        <h1>Olá, <span id="userName">usuário</span> 👋</h1>
      </div>
      <a class="btn btn-primary" href="nova-proposta.html">+ Nova proposta</a>
    </div>

    <section class="stats-grid">
      <article class="stat-card"><span>Propostas</span><strong id="totalPropostas">0</strong><small>Total criado</small></article>
      <article class="stat-card"><span>Aguardando</span><strong id="aguardando">0</strong><small>Precisam de retorno</small></article>
      <article class="stat-card"><span>Aceitas</span><strong id="aceitas">0</strong><small>Negócios fechados</small></article>
      <article class="stat-card"><span>Valor aceito</span><strong id="valorAceito">R$ 0</strong><small>Em propostas aceitas</small></article>
    </section>

    <section class="card content-card">
      <div class="content-card-head">
        <div>
          <h2>Propostas recentes</h2>
          <p>Acompanhe suas últimas negociações.</p>
        </div>
        <a href="propostas.html">Ver todas →</a>
      </div>
      <div id="recentProposals" class="table-wrap"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/common.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
</body>
</html>
