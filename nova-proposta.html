<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova proposta — PropostaFlow</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="app-page">
  <aside class="sidebar">
    <a class="logo" href="dashboard.html">Proposta<span>Flow</span></a>
    <nav>
      <a href="dashboard.html">▦ Dashboard</a>
      <a href="clientes.html">👥 Clientes</a>
      <a href="propostas.html">📝 Propostas</a>
      <a class="active" href="nova-proposta.html">＋ Nova proposta</a>
    </nav>
    <button id="logoutBtn" class="sidebar-logout">Sair</button>
  </aside>

  <main class="app-main">
    <div class="app-header">
      <div>
        <p class="eyebrow">CRIAR</p>
        <h1>Nova proposta</h1>
      </div>
    </div>

    <form id="proposalForm" class="proposal-layout">
      <section class="card form-card">
        <h2>Informações</h2>

        <label>Cliente</label>
        <select id="proposalClient" required>
          <option value="">Selecione um cliente</option>
        </select>

        <label>Título da proposta</label>
        <input id="proposalTitle" placeholder="Ex.: Desenvolvimento de site institucional" required />

        <div class="grid-2">
          <div>
            <label>Valor</label>
            <input id="proposalValue" type="number" step="0.01" min="0" placeholder="1500" required />
          </div>
          <div>
            <label>Prazo</label>
            <input id="proposalDeadline" placeholder="Ex.: 10 dias úteis" />
          </div>
        </div>

        <label>Descrição</label>
        <textarea id="proposalDescription" rows="7" placeholder="Descreva o serviço, entregáveis, condições..." required></textarea>

        <label>Observações</label>
        <textarea id="proposalNotes" rows="4" placeholder="Ex.: 50% no início e 50% na entrega."></textarea>

        <div class="proposal-actions">
          <button class="btn btn-outline" type="button" id="saveDraft">Salvar rascunho</button>
          <button class="btn btn-primary" type="submit">Criar proposta</button>
        </div>
      </section>

      <aside class="card preview-card">
        <span class="eyebrow">PRÉVIA</span>
        <h2 id="previewTitle">Sua proposta</h2>
        <p id="previewClient">Cliente ainda não selecionado</p>
        <div class="preview-value" id="previewValue">R$ 0,00</div>
        <p id="previewDeadline">Prazo a definir</p>
        <hr />
        <p id="previewDescription">A descrição aparecerá aqui.</p>
      </aside>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/common.js"></script>
<script src="js/nova-proposta.js"></script>
</body>
</html>
