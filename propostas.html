<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Propostas | PropostaFlow</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #07111f;
      color: white;
      min-height: 100vh;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      background: #0d1b2e;
      border-right: 1px solid #24344a;
      padding: 30px 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 40px;
    }

    .logo span {
      color: #7257ff;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu a {
      color: #d5dbea;
      text-decoration: none;
      padding: 13px 15px;
      border-radius: 10px;
    }

    .menu a:hover,
    .menu a.ativo {
      background: #182a43;
      color: white;
    }

    .conteudo {
      flex: 1;
      padding: 35px;
    }

    .topo {
      margin-bottom: 30px;
    }

    .topo h1 {
      font-size: 30px;
      margin-bottom: 6px;
    }

    .topo p {
      color: #8f9db1;
    }

    .card {
      background: #0e1b2d;
      border: 1px solid #22334a;
      border-radius: 15px;
      padding: 24px;
      margin-bottom: 30px;
    }

    .card h2 {
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .campo label {
      color: #9aa9bd;
      font-size: 13px;
    }

    input,
    select,
    textarea {
      background: #091524;
      color: white;
      border: 1px solid #263850;
      border-radius: 9px;
      padding: 12px;
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 110px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #7257ff;
    }

    .campo-grande {
      margin-top: 16px;
    }

    .btn {
      border: none;
      border-radius: 9px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-primary {
      background: linear-gradient(
        135deg,
        #4268ff,
        #7b4dff
      );
      color: white;
    }

    .btn-danger {
      background: #3a1620;
      color: #ff9daf;
    }

    .acoes-form {
      margin-top: 20px;
    }

    .lista {
      display: grid;
      gap: 15px;
      margin-top: 18px;
    }

    .proposta {
      background: #0e1b2d;
      border: 1px solid #22334a;
      border-radius: 14px;
      padding: 22px;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .proposta-info h3 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .proposta-info p {
      color: #8f9db1;
      margin-top: 5px;
    }

    .valor {
      color: #8e77ff !important;
      font-weight: 800;
      font-size: 18px;
    }

    .proposta-acoes {
      display: flex;
      gap: 10px;
    }

    .vazio {
      color: #8f9db1;
      padding: 20px 0;
    }

    @media(max-width: 750px) {
      .sidebar {
        display: none;
      }

      .conteudo {
        padding: 20px;
      }

      .proposta {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<div class="layout">

  <aside class="sidebar">

    <div class="logo">
      Proposta<span>Flow</span>
    </div>

    <nav class="menu">

      <a href="painel.html">
        🏠 Início
      </a>

      <a href="clientes.html">
        👥 Clientes
      </a>

      <a
        href="propostas.html"
        class="ativo"
      >
        📄 Propostas
      </a>

      <a href="planos.html">
        ⭐ Planos
      </a>

    </nav>

  </aside>


  <main class="conteudo">

    <div class="topo">

      <h1>Propostas</h1>

      <p>
        Crie e gerencie suas propostas comerciais.
      </p>

    </div>


    <section class="card">

      <h2>Nova proposta</h2>

      <div class="form-grid">

        <div class="campo">

          <label>Cliente</label>

          <select id="cliente">
            <option value="">
              Selecione um cliente
            </option>
          </select>

        </div>


        <div class="campo">

          <label>Título</label>

          <input
            id="titulo"
            type="text"
            placeholder="Ex: Desenvolvimento de site"
          >

        </div>


        <div class="campo">

          <label>Valor</label>

          <input
            id="valor"
            type="number"
            step="0.01"
            placeholder="Ex: 1500"
          >

        </div>


        <div class="campo">

          <label>Prazo</label>

          <input
            id="prazo"
            type="text"
            placeholder="Ex: 15 dias"
          >

        </div>

      </div>


      <div class="campo campo-grande">

        <label>Descrição</label>

        <textarea
          id="descricao"
          placeholder="Descreva o serviço..."
        ></textarea>

      </div>


      <div class="campo campo-grande">

        <label>Observações</label>

        <textarea
          id="observacoes"
          placeholder="Observações adicionais..."
        ></textarea>

      </div>


      <div class="acoes-form">

        <button
          id="btnSalvar"
          class="btn btn-primary"
        >
          Criar proposta
        </button>

      </div>

    </section>


    <section>

      <h2>Suas propostas</h2>

      <div
        id="listaPropostas"
        class="lista"
      >

        <p class="vazio">
          Carregando...
        </p>

      </div>

    </section>

  </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/propostas.js"></script>

</body>
</html>
